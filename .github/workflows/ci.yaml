name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# rust-toolchain.toml selects nightly.
env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  tests:
    name: Tests and frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # .cargo/config.toml links with clang and mold on Linux. The mold 1.0 of Ubuntu 22.04
      # mislinks the bundled DuckDB, which aborts when a database is opened, so a release of
      # mold is installed instead.
      - name: Install the Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang
          curl -sSfL "https://github.com/rui314/mold/releases/download/v2.40.4/mold-2.40.4-$(uname -m)-linux.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          sudo ln -sf /usr/local/bin/mold /usr/bin/mold
          mold --version

      # tauri-build checks that the sidecars exist, the tests do not run them, see
      # scripts/download-sidecars.sh for the real ones.
      - name: Placeholder sidecars
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          touch "assets/rerun-cli-$target" "assets/swarmy-bevy-$target"
          chmod +x assets/rerun-cli-* assets/swarmy-bevy-*

      - name: Run the tests
        run: cargo test --locked -p swarmy -p swarmy-common

      - name: Check the frontend
        run: cargo check --locked -p swarmy-ui --target wasm32-unknown-unknown
