[package]
name = "swarmy"
version = "0.2.1"
description = "Swarmy Tauri App"
authors = ["Seb Ospina <kraige@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swarmy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nom-mpq = "2.0.7"
swarmy-common = { path = "../swarmy-common" }
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
chrono = { version = "0.4.45", features = [] }
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
convert_case = "0.12.0"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
png = "0.18"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"

[dev-dependencies]
test-log = { version = "0.2", default-features = false, features = ["trace"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { workspace = true }
tokio = { version = "1", features = ["full"] }
s2protocol = { workspace = true, features = ["dep_arrow", "textures"] }
rerun = { version = "0.40", default-features = false, features = ["sdk"] }
tracing = { workspace = true, features = [] }
# Watches the replay directory for new replays, inotify on Linux.
notify = "8"
# The personal database of the replay notes, ratings, tags and chat messages.
duckdb = { version = "1.20000", features = ["bundled"] }
# The sha256 of the replays, the same as s2protocol's ext_fs_sha256.
sha256 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
