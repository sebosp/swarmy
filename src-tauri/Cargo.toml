[package]
name = "swarmy"
version = "0.2.6"
description = "Swarmy Tauri App"
authors = ["Seb Ospina <kraige@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swarmy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nom-mpq = "2.0.14"
swarmy-common = { path = "../swarmy-common" }
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
chrono = { version = "0.4.45", features = [] }
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
convert_case = "0.12.0"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
png = "0.18"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
# json: the access log of `--serve`, a JSON line per request, see access_log.rs.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"

[dev-dependencies]
test-log = { version = "0.2", default-features = false, features = ["trace"] }
# The tests of the queries: the SQL of each README runs on the same frames as the Polars plan
# (`sql` is not in `full`), and the two results are compared with assert_dataframe_equal!.
polars = { workspace = true, features = ["sql"] }
polars-testing = "0.55"
# The benchmarks of the queries on a real snapshot, benches/queries.rs, see scripts/bench.sh.
criterion = "0.8"

[[bench]]
name = "queries"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { workspace = true }
tokio = { version = "1", features = ["full"] }
s2protocol = { workspace = true, features = ["dep_arrow", "textures"] }
rerun = { version = "0.40", default-features = false, features = ["sdk"] }
tracing = { workspace = true, features = [] }
# Watches the replay directory for new replays, inotify on Linux.
notify = "8"
# The personal database of the replay notes, ratings, tags and chat messages.
duckdb = { version = "1.20000", features = ["bundled"] }
# The sha256 of the replays, the same as s2protocol's ext_fs_sha256.
sha256 = "1"
# The administrator key of the browser version, see web.rs.
sha2 = "0.10"
# The remote backend: the server of `--serve` and the client of the app, see server.rs.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = "0.3"
# The metrics of the server, GET /metrics, see access_log.rs.
prometheus = { version = "0.14", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# The API of StarCraft II, to play a replay in the game (`sc2_game`).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tungstenite = "0.30"
