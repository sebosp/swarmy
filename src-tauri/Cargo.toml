[package]
name = "swarmy-tauri"
version = "0.1.0"
description = "Swarmy Tauri App"
authors = ["Seb Ospina <kraige@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swarmy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-store = "2"
s2protocol = { workspace = true }
swarmy-tauri-common = { path = "../swarmy-tauri-common" }
chrono = { version = "0.4.41", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { version = "0.53.0", default-features = false }
reqwest = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
